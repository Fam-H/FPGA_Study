<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UART RX Complete Cycle - Letter A</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1a1a1a;
    --text-dim: rgba(0,0,0,0.3);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --text: #e8e8e8;
      --text-dim: rgba(255,255,255,0.3);
    }
  }
  body {
    margin: 0;
    padding: 24px;
    background: var(--bg);
    display: flex;
    justify-content: center;
  }
  svg { max-width: 720px; width: 100%; }
</style>
</head>
<body>
<svg width="100%" viewBox="0 0 680 480" role="img" xmlns="http://www.w3.org/2000/svg" style="color: var(--text)">
<title>RX 전체 사이클 - 'A' 수신</title>
<desc>Start 감지 후 16배 오버샘플로 비트 중앙 샘플링하여 8비트 복원</desc>
<defs>
<marker id="arR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<text x="340" y="26" text-anchor="middle" font-size="15px" font-weight="500" fill="currentColor">RX 한 사이클 - 'A' (0x41) 수신</text>

<text x="50" y="70" text-anchor="end" font-size="13px" font-weight="500" fill="currentColor">rx 라인</text>
<line x1="60" y1="70" x2="640" y2="70" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
<path d="M60 55 L120 55 L120 85 L172 85 L172 55 L224 55 L224 85 L276 85 L276 85 L328 85 L328 85 L380 85 L380 85 L432 85 L432 85 L484 85 L484 55 L536 55 L536 85 L580 85 L580 55 L640 55" fill="none" stroke="#185FA5" stroke-width="2.5"/>

<rect x="120" y="100" width="52" height="22" rx="4" fill="#FAC775" stroke="#412402" stroke-width="1"/>
<text x="146" y="116" text-anchor="middle" font-size="11px" font-weight="500" fill="#412402">Start</text>

<rect x="172" y="100" width="52" height="22" rx="4" fill="#85B7EB" stroke="#042C53" stroke-width="1"/>
<text x="198" y="116" text-anchor="middle" font-size="11px" font-weight="500" fill="#042C53">D0=1</text>
<rect x="224" y="100" width="52" height="22" rx="4" fill="#85B7EB" stroke="#042C53" stroke-width="1"/>
<text x="250" y="116" text-anchor="middle" font-size="11px" font-weight="500" fill="#042C53">D1=0</text>
<rect x="276" y="100" width="52" height="22" rx="4" fill="#85B7EB" stroke="#042C53" stroke-width="1"/>
<text x="302" y="116" text-anchor="middle" font-size="11px" font-weight="500" fill="#042C53">D2=0</text>
<rect x="328" y="100" width="52" height="22" rx="4" fill="#85B7EB" stroke="#042C53" stroke-width="1"/>
<text x="354" y="116" text-anchor="middle" font-size="11px" font-weight="500" fill="#042C53">D3=0</text>
<rect x="380" y="100" width="52" height="22" rx="4" fill="#85B7EB" stroke="#042C53" stroke-width="1"/>
<text x="406" y="116" text-anchor="middle" font-size="11px" font-weight="500" fill="#042C53">D4=0</text>
<rect x="432" y="100" width="52" height="22" rx="4" fill="#85B7EB" stroke="#042C53" stroke-width="1"/>
<text x="458" y="116" text-anchor="middle" font-size="11px" font-weight="500" fill="#042C53">D5=0</text>
<rect x="484" y="100" width="52" height="22" rx="4" fill="#85B7EB" stroke="#042C53" stroke-width="1"/>
<text x="510" y="116" text-anchor="middle" font-size="11px" font-weight="500" fill="#042C53">D6=1</text>
<rect x="536" y="100" width="44" height="22" rx="4" fill="#85B7EB" stroke="#042C53" stroke-width="1"/>
<text x="558" y="116" text-anchor="middle" font-size="11px" font-weight="500" fill="#042C53">D7=0</text>

<rect x="580" y="100" width="52" height="22" rx="4" fill="#9FE1CB" stroke="#04342C" stroke-width="1"/>
<text x="606" y="116" text-anchor="middle" font-size="11px" font-weight="500" fill="#04342C">Stop</text>

<line x1="120" y1="50" x2="120" y2="160" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="120" y="44" text-anchor="middle" font-size="11px" fill="#D85A30">감지</text>

<line x1="146" y1="50" x2="146" y2="160" stroke="#1D9E75" stroke-width="1.5"/>
<circle cx="146" cy="85" r="4" fill="#1D9E75"/>
<text x="146" y="44" text-anchor="middle" font-size="11px" fill="#1D9E75">검증</text>

<g stroke="#1D9E75" stroke-width="1.5">
<line x1="198" y1="50" x2="198" y2="160"/>
<line x1="250" y1="50" x2="250" y2="160"/>
<line x1="302" y1="50" x2="302" y2="160"/>
<line x1="354" y1="50" x2="354" y2="160"/>
<line x1="406" y1="50" x2="406" y2="160"/>
<line x1="458" y1="50" x2="458" y2="160"/>
<line x1="510" y1="50" x2="510" y2="160"/>
<line x1="558" y1="50" x2="558" y2="160"/>
</g>

<g fill="#1D9E75">
<circle cx="198" cy="55" r="4"/>
<circle cx="250" cy="85" r="4"/>
<circle cx="302" cy="85" r="4"/>
<circle cx="354" cy="85" r="4"/>
<circle cx="406" cy="85" r="4"/>
<circle cx="458" cy="85" r="4"/>
<circle cx="510" cy="55" r="4"/>
<circle cx="558" cy="85" r="4"/>
</g>

<text x="378" y="160" text-anchor="middle" font-size="11px" fill="#1D9E75">↑ 각 비트 정중앙에서 샘플링</text>

<text x="50" y="195" text-anchor="end" font-size="13px" font-weight="500" fill="currentColor">rx_done</text>
<line x1="60" y1="195" x2="640" y2="195" stroke="currentColor" stroke-width="0.5" opacity="0.3"/>
<path d="M60 200 L606 200 L606 185 L626 185 L626 200 L640 200" fill="none" stroke="#D85A30" stroke-width="2"/>
<text x="606" y="180" text-anchor="middle" font-size="11px" fill="#D85A30">1클럭 펄스</text>

<text x="50" y="230" text-anchor="end" font-size="13px" font-weight="500" fill="currentColor">rx_data</text>
<rect x="60" y="220" width="546" height="20" rx="4" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.4"/>
<text x="333" y="234" text-anchor="middle" font-size="11px" fill="currentColor">이전 값 유지</text>
<rect x="606" y="220" width="34" height="20" rx="4" fill="#9FE1CB" stroke="#04342C" stroke-width="1"/>
<text x="623" y="234" text-anchor="middle" font-size="11px" font-weight="500" fill="#04342C">0x41</text>

<rect x="40" y="262" width="290" height="100" rx="8" fill="#FAEEDA" stroke="#412402" stroke-width="1"/>
<text x="60" y="284" font-size="13px" font-weight="500" fill="#412402">1~2단계: 감지와 검증 (S_IDLE → S_START)</text>
<text x="60" y="304" font-size="12px" fill="#412402">PC가 라인을 LOW로 떨어뜨리면 즉시 S_START</text>
<text x="60" y="320" font-size="12px" fill="#412402">8 오버샘플 틱(반 비트) 후 다시 LOW인지 확인</text>
<text x="60" y="336" font-size="12px" fill="#412402">→ LOW면 진짜 Start (정중앙 동기화 완료)</text>
<text x="60" y="352" font-size="12px" fill="#412402">→ HIGH면 노이즈, S_IDLE로 복귀</text>

<rect x="350" y="262" width="290" height="100" rx="8" fill="#E6F1FB" stroke="#042C53" stroke-width="1"/>
<text x="370" y="284" font-size="13px" font-weight="500" fill="#042C53">3단계: 8비트 수신 (S_DATA)</text>
<text x="370" y="304" font-size="12px" fill="#042C53">16 오버샘플 틱마다 비트 정중앙 도달</text>
<text x="370" y="320" font-size="12px" fill="#042C53">정중앙에서 rx_sync2 값을 rx_shift의 MSB에 삽입</text>
<text x="370" y="336" font-size="12px" fill="#042C53">기존 비트들은 오른쪽 시프트 (LSB 먼저 받음)</text>
<text x="370" y="352" font-size="12px" fill="#042C53">8번 반복 후 rx_shift = 01000001 = 0x41</text>

<rect x="40" y="372" width="600" height="84" rx="8" fill="#E1F5EE" stroke="#04342C" stroke-width="1"/>
<text x="60" y="394" font-size="13px" font-weight="500" fill="#04342C">4~5단계: 마무리 (S_STOP → S_IDLE)</text>
<text x="60" y="414" font-size="12px" fill="#04342C">Stop bit 1비트 시간 대기 후 rx_done을 1클럭 펄스로 발생</text>
<text x="60" y="432" font-size="12px" fill="#04342C">동시에 rx_data에 rx_shift(0x41) 출력 → 외부 모듈이 사용</text>
<text x="60" y="448" font-size="12px" fill="#04342C">S_IDLE로 복귀, 다음 바이트 대기</text>
</svg>
</body>
</html>
