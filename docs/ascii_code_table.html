<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCII Code Table</title>
<style>
  :root {
    --bg-primary: #ffffff;
    --bg-secondary: #f5f4f0;
    --bg-tertiary: #eeedea;
    --text-primary: #1a1a1a;
    --text-secondary: #6b6a65;
    --text-tertiary: #9c9a92;
    --border-tertiary: rgba(0,0,0,0.12);
    --border-secondary: rgba(0,0,0,0.25);
    --border-primary: rgba(0,0,0,0.4);
    --bg-info: #E6F1FB;
    --text-info: #0C447C;
    --border-info: #85B7EB;
    --bg-success: #EAF3DE;
    --text-success: #27500A;
    --bg-warning: #FAEEDA;
    --text-warning: #633806;
    --bg-danger: #FCEBEB;
    --text-danger: #791F1F;
    --radius-md: 8px;
    --radius-lg: 12px;
    --font-mono: 'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-primary: #1a1a1a;
      --bg-secondary: #2a2a28;
      --bg-tertiary: #333331;
      --text-primary: #e8e8e8;
      --text-secondary: #9c9a92;
      --text-tertiary: #6b6a65;
      --border-tertiary: rgba(255,255,255,0.12);
      --border-secondary: rgba(255,255,255,0.25);
      --border-primary: rgba(255,255,255,0.4);
      --bg-info: #0C447C;
      --text-info: #B5D4F4;
      --border-info: #185FA5;
      --bg-success: #27500A;
      --text-success: #C0DD97;
      --bg-warning: #412402;
      --text-warning: #FAC775;
      --bg-danger: #501313;
      --text-danger: #F7C1C1;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    padding: 24px;
    line-height: 1.6;
  }
  h1 {
    font-size: 22px;
    font-weight: 500;
    margin-bottom: 20px;
    color: var(--text-primary);
  }
  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 6px 14px;
    border-radius: var(--radius-md);
    border: 0.5px solid var(--border-secondary);
    background: transparent;
    color: var(--text-primary);
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    transition: background .15s;
  }
  .filter-btn:hover { background: var(--bg-secondary); }
  .filter-btn.on {
    background: var(--bg-info);
    color: var(--text-info);
    border-color: var(--border-info);
  }
  .legend {
    display: flex;
    gap: 14px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .legend-dot {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    border: 0.5px solid var(--border-tertiary);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    gap: 6px;
  }
  .cell {
    border-radius: var(--radius-md);
    padding: 8px 6px;
    text-align: center;
    cursor: pointer;
    border: 0.5px solid var(--border-tertiary);
    transition: border-color .15s, background .15s;
  }
  .cell:hover {
    border-color: var(--border-primary);
    background: var(--bg-secondary);
  }
  .cell.sel {
    border-color: var(--border-info);
    border-width: 2px;
    background: var(--bg-info);
  }
  .cell-char {
    font-size: 18px;
    font-weight: 500;
    color: var(--text-primary);
    line-height: 1.4;
    font-family: var(--font-mono);
  }
  .cell-dec {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .cat-ctrl { background: var(--bg-warning); }
  .cat-ctrl .cell-char { color: var(--text-warning); font-size: 11px; }
  .cat-num { background: var(--bg-info); }
  .cat-upper { background: var(--bg-success); }
  .cat-lower { background: var(--bg-danger); }
  .detail {
    margin-top: 20px;
    padding: 20px 24px;
    border-radius: var(--radius-lg);
    border: 0.5px solid var(--border-tertiary);
    display: none;
  }
  .detail.show { display: block; }
  .detail-big {
    font-size: 48px;
    font-weight: 500;
    color: var(--text-primary);
    font-family: var(--font-mono);
    text-align: center;
    margin-bottom: 8px;
  }
  .detail-desc {
    text-align: center;
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 16px;
  }
  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 12px;
    margin-top: 12px;
  }
  .detail-item { text-align: center; }
  .detail-label {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }
  .detail-val {
    font-size: 18px;
    font-weight: 500;
    color: var(--text-primary);
    font-family: var(--font-mono);
  }
  .detail-bits {
    display: flex;
    gap: 4px;
    justify-content: center;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .bit-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .bit {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--radius-md);
    font-family: var(--font-mono);
    font-size: 16px;
    font-weight: 500;
  }
  .bit-1 { background: var(--bg-info); color: var(--text-info); }
  .bit-0 { background: var(--bg-secondary); color: var(--text-secondary); }
  .bit-label {
    font-size: 11px;
    color: var(--text-tertiary);
    text-align: center;
    width: 36px;
  }
  .uart-order {
    text-align: center;
    margin-top: 12px;
    font-size: 12px;
    color: var(--text-secondary);
  }
</style>
</head>
<body>

<h1>ASCII code table</h1>
<div class="filters" id="filters"></div>
<div class="legend" id="legend"></div>
<div class="grid" id="grid"></div>
<div class="detail" id="detail"></div>

<script>
const cats = [
  { id: 'all', label: 'All' },
  { id: 'upper', label: 'A - Z' },
  { id: 'lower', label: 'a - z' },
  { id: 'num', label: '0 - 9' },
  { id: 'sym', label: 'Symbols' },
  { id: 'ctrl', label: 'Control' }
];
const legendData = [
  { label: 'A - Z', bg: 'var(--bg-success)' },
  { label: 'a - z', bg: 'var(--bg-danger)' },
  { label: '0 - 9', bg: 'var(--bg-info)' },
  { label: 'Symbols', bg: 'transparent' },
  { label: 'Control', bg: 'var(--bg-warning)' }
];
const ctrlNames = {
  0:'NUL',1:'SOH',2:'STX',3:'ETX',4:'EOT',5:'ENQ',6:'ACK',7:'BEL',
  8:'BS',9:'TAB',10:'LF',11:'VT',12:'FF',13:'CR',14:'SO',15:'SI',
  16:'DLE',17:'DC1',18:'DC2',19:'DC3',20:'DC4',21:'NAK',22:'SYN',23:'ETB',
  24:'CAN',25:'EM',26:'SUB',27:'ESC',28:'FS',29:'GS',30:'RS',31:'US',127:'DEL'
};

function getCategory(c) {
  if (c < 32 || c === 127) return 'ctrl';
  if (c >= 48 && c <= 57) return 'num';
  if (c >= 65 && c <= 90) return 'upper';
  if (c >= 97 && c <= 122) return 'lower';
  return 'sym';
}
function getDisplay(c) {
  if (c < 32 || c === 127) return ctrlNames[c] || '?';
  if (c === 32) return 'SP';
  return String.fromCharCode(c);
}

let activeFilter = 'all';
let selectedCode = 65;
const filtersEl = document.getElementById('filters');
const legendEl = document.getElementById('legend');
const gridEl = document.getElementById('grid');
const detailEl = document.getElementById('detail');

cats.forEach(c => {
  const b = document.createElement('button');
  b.className = 'filter-btn' + (c.id === 'all' ? ' on' : '');
  b.textContent = c.label;
  b.dataset.cat = c.id;
  b.onclick = () => {
    activeFilter = c.id;
    document.querySelectorAll('.filter-btn').forEach(x =>
      x.classList.toggle('on', x.dataset.cat === c.id)
    );
    renderGrid();
  };
  filtersEl.appendChild(b);
});

legendData.forEach(l => {
  const d = document.createElement('span');
  d.className = 'legend-item';
  d.innerHTML = '<span class="legend-dot" style="background:' + l.bg + '"></span>' + l.label;
  legendEl.appendChild(d);
});

function renderGrid() {
  gridEl.innerHTML = '';
  for (let i = 0; i < 128; i++) {
    const cat = getCategory(i);
    if (activeFilter !== 'all' && cat !== activeFilter) continue;
    const d = document.createElement('div');
    d.className = 'cell cat-' + cat + (i === selectedCode ? ' sel' : '');
    d.innerHTML = '<div class="cell-char">' + getDisplay(i) + '</div><div class="cell-dec">' + i + '</div>';
    d.onclick = () => { selectedCode = i; renderGrid(); renderDetail(); };
    gridEl.appendChild(d);
  }
}

function renderDetail() {
  const c = selectedCode;
  const cat = getCategory(c);
  const hex = c.toString(16).toUpperCase().padStart(2, '0');
  const bin = c.toString(2).padStart(8, '0');
  const bits = bin.split('');
  let charDisplay = getDisplay(c);
  let desc = '';
  if (cat === 'ctrl') desc = 'Control character';
  else if (cat === 'num') desc = 'Number';
  else if (cat === 'upper') desc = 'Uppercase letter';
  else if (cat === 'lower') desc = 'Lowercase letter';
  else desc = 'Symbol';

  detailEl.className = 'detail show';
  detailEl.innerHTML =
    '<div class="detail-big">' + charDisplay + '</div>' +
    '<div class="detail-desc">' + desc + '</div>' +
    '<div class="detail-grid">' +
      '<div class="detail-item"><div class="detail-label">Decimal</div><div class="detail-val">' + c + '</div></div>' +
      '<div class="detail-item"><div class="detail-label">Hex</div><div class="detail-val">0x' + hex + '</div></div>' +
      '<div class="detail-item"><div class="detail-label">Binary</div><div class="detail-val">' + bin + '</div></div>' +
      '<div class="detail-item"><div class="detail-label">Verilog</div><div class="detail-val">8\'h' + hex + '</div></div>' +
    '</div>' +
    '<div class="detail-bits">' +
      bits.map((b, i) =>
        '<div class="bit-col"><div class="bit bit-' + b + '">' + b + '</div><div class="bit-label">D' + (7 - i) + '</div></div>'
      ).join('') +
    '</div>' +
    '<div class="uart-order">UART 전송 순서 (LSB 먼저): ' + bits.slice().reverse().join(' ') + '</div>';
}

renderGrid();
renderDetail();
</script>
</body>
</html>
